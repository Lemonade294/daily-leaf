name: Daily Self-Update

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Stamp today's date into the site
        run: python update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A                       # ← 改成 -A，避免漏文件
          if git diff --cached --quiet; then
            echo "No change today"
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')   # ← 更清晰
          git commit -m "chore: daily update ${TODAY}"
          # ← 加 rebase + 重试，防止并发 push 失败
          for i in 1 2 3; do
            git push && break
            echo "push failed, retrying after rebase..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
