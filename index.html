<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拾页外刊 · The Daily Leaf — 每日英文阅读</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='24' rx='3' fill='%233E7C6F'/%3E%3Cpath d='M16 12c-2-2.2-4.6-3-8-2.6v13.2c3.4-.4 6 .4 8 2.6 2-2.2 4.6-3 8-2.6V9.4c-3.4-.4-6 .4-8 2.6z' fill='%23F6F4EF'/%3E%3Cpath d='M16 12v13.2' stroke='%233E7C6F' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ============================================================
   拾页外刊 The Daily Leaf — 样式系统
   日间 Paper / 夜间 Midnight 双主题（CSS 变量切换）
   ============================================================ */
:root{
  --font-en:'Lora', Georgia, 'Times New Roman', 'Noto Serif SC', serif;
  --font-zh:'Noto Serif SC','Songti SC',SimSun,serif;
  --font-ui:'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --max-w:1240px; --read-w:700px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* ---------- 日间 Paper ---------- */
:root, html[data-theme="paper"]{
  --bg:#F6F4EE; --bg-deep:#EDE9DF; --bg-soft:#FBF9F4;
  --surface:#FFFFFF; --surface-2:#F4F1E9;
  --text:#292E35; --text-2:#5A626D; --text-3:#8B929C;
  --accent:#3E7C6F; --accent-ink:#2C5E54; --accent-soft:#E2EDE8;
  --accent-2:#6FA396;
  --line:#E4E0D6; --line-strong:#C8C3B6;
  --shadow:0 2px 6px rgba(70,60,40,.05), 0 10px 30px rgba(70,60,40,.07);
  --shadow-lift:0 6px 16px rgba(70,60,40,.08), 0 18px 44px rgba(70,60,40,.12);
  --overlay:rgba(246,244,238,.92);
  --dict-bg:#FFFFFF; --dict-border:#E4E0D6;
  --cover-ink:#FFFFFF;
  --grid-line:rgba(80,90,95,.06);
}
/* ---------- 夜间 Midnight ---------- */
html[data-theme="midnight"]{
  --bg:#131720; --bg-deep:#0E1117; --bg-soft:#171C25;
  --surface:#1C232E; --surface-2:#202936;
  --text:#E7E4DC; --text-2:#A8B0BD; --text-3:#6F7784;
  --accent:#7FB5A6; --accent-ink:#A9D6C8; --accent-soft:#24352F;
  --accent-2:#4E8F80;
  --line:#2A3340; --line-strong:#3C4655;
  --shadow:0 2px 6px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.32);
  --shadow-lift:0 6px 16px rgba(0,0,0,.3), 0 18px 44px rgba(0,0,0,.45);
  --overlay:rgba(19,23,32,.94);
  --dict-bg:#1C232E; --dict-border:#333D4C;
  --grid-line:rgba(220,225,235,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html.reduced *{transition:none!important;animation:none!important}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .35s var(--ease), color .35s var(--ease);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 500px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 420px at -10% 110%, var(--accent-soft), transparent 55%);
  opacity:.5; transition:opacity .35s var(--ease);
}
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
::selection{background:var(--accent); color:#fff}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:var(--overlay);
  border-bottom:1px solid var(--line);
  transition:background .35s var(--ease), border-color .35s var(--ease);
}
.topbar-inner{
  max-width:var(--max-w); margin:0 auto; padding:0 28px; height:66px;
  display:flex; align-items:center; gap:22px;
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0; cursor:pointer; user-select:none}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(140deg, var(--accent), var(--accent-2));
  display:grid; place-items:center; color:#fff;
  box-shadow:0 4px 12px rgba(62,124,111,.35);
}
.brand-name{font-family:var(--font-zh); font-weight:900; font-size:17px; letter-spacing:.12em; color:var(--text); white-space:nowrap}
.brand-sub{font-family:var(--font-en); font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--text-3); margin-top:1px; white-space:nowrap}
.nav{display:flex; gap:4px; flex:1; min-width:0}
.nav-btn{
  padding:7px 15px; border-radius:999px; font-size:14px; font-weight:500;
  color:var(--text-2); transition:all .22s var(--ease); white-space:nowrap;
}
.nav-btn:hover{color:var(--text); background:var(--surface-2)}
.nav-btn.active{color:var(--accent-ink); background:var(--accent-soft)}
.top-actions{display:flex; align-items:center; gap:6px; flex-shrink:0}
.icon-btn{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  color:var(--text-2); transition:all .22s var(--ease); position:relative;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text)}
.icon-btn svg{width:19px; height:19px}
.icon-badge{
  position:absolute; top:3px; right:2px; min-width:17px; height:17px; padding:0 4px;
  background:var(--accent); color:#fff; font-size:10.5px; font-weight:700;
  border-radius:999px; display:grid; place-items:center; line-height:1;
  box-shadow:0 0 0 2px var(--surface);
}
.search-box{
  position:relative; display:flex; align-items:center; flex-shrink:0;
}
.search-box input{
  width:210px; height:38px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); color:var(--text); padding:0 14px 0 38px;
  font-family:var(--font-ui); font-size:14px; outline:none;
  transition:all .22s var(--ease);
}
.search-box input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); width:250px}
.search-box svg{position:absolute; left:12px; width:17px; height:17px; color:var(--text-3); pointer-events:none}
.search-box .clear-search{position:absolute; right:8px; width:22px; height:22px; border-radius:50%; display:none; place-items:center; color:var(--text-3)}
.search-box .clear-search.show{display:grid}
.search-box .clear-search:hover{background:var(--surface-2); color:var(--text)}

/* ============ 主区 ============ */
main{flex:1; width:100%}
.view{display:none; animation:fadeUp .5s var(--ease)}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
.container{max-width:var(--max-w); margin:0 auto; padding:34px 28px 80px}

/* ============ 首页 Hero ============ */
.hero{
  position:relative; padding:46px 0 30px; display:flex; flex-wrap:wrap;
  align-items:flex-end; gap:26px; justify-content:space-between;
}
.hero-left{min-width:280px; flex:1}
.hero-kicker{
  font-family:var(--font-en); font-size:12px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--accent); font-weight:600; display:flex; align-items:center; gap:12px;
}
.hero-kicker::before{content:''; width:34px; height:1.5px; background:var(--accent); opacity:.7}
.hero-title{
  font-family:var(--font-zh); font-weight:900; font-size:clamp(28px, 4.4vw, 44px);
  line-height:1.28; margin-top:14px; letter-spacing:.02em; color:var(--text);
}
.hero-title em{
  font-family:var(--font-en); font-style:italic; font-weight:600; color:var(--accent);
  padding:0 .1em;
}
.hero-desc{color:var(--text-2); margin-top:12px; font-size:15px; max-width:560px; line-height:1.9}
.hero-date{
  flex-shrink:0; text-align:right; padding-bottom:6px;
}
.hero-date .day{
  font-family:var(--font-en); font-weight:600; font-size:46px; line-height:1;
  color:var(--text); letter-spacing:.02em;
}
.hero-date .ymd{font-size:13px; color:var(--text-2); margin-top:6px; letter-spacing:.08em}
.hero-date .count{
  margin-top:12px; display:inline-flex; align-items:center; gap:8px;
  background:var(--accent-soft); color:var(--accent-ink);
  font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px;
}
.hero-date .count .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ 筛选条 ============ */
.filterbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:10px 0 28px}
.pill-group{display:flex; gap:6px; flex-wrap:wrap}
.pill{
  padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:500;
  color:var(--text-2); background:var(--surface); border:1px solid var(--line);
  transition:all .2s var(--ease); user-select:none;
}
.pill:hover{border-color:var(--accent); color:var(--accent-ink)}
.pill.active{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 4px 12px rgba(62,124,111,.3)}
.pill .cnt{opacity:.65; font-size:12px; margin-left:4px; font-weight:400}
.filterbar .divider{width:1px; height:20px; background:var(--line); margin:0 4px}
.filter-hint{color:var(--text-3); font-size:13px; margin-left:auto}

/* ============ 卡片书封墙 ============ */
.grid{
  display:grid; gap:26px;
  grid-template-columns:repeat(4, 1fr);
}
@media(max-width:1180px){ .grid{grid-template-columns:repeat(3, 1fr)} }
@media(max-width:860px){ .grid{grid-template-columns:repeat(2, 1fr)} }
@media(max-width:520px){ .grid{grid-template-columns:1fr} }
.book-card{
  position:relative; border-radius:var(--r-md); overflow:hidden;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow); cursor:pointer;
  transition:transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
  display:flex; flex-direction:column;
}
.book-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lift); border-color:var(--line-strong)}
.book-cover{
  position:relative; height:172px; overflow:hidden; flex-shrink:0;
}
.book-cover::before{
  content:''; position:absolute; inset:0;
  background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.5;
}
.cover-meta{
  position:absolute; left:18px; top:16px; display:flex; gap:8px; align-items:center;
  color:rgba(255,255,255,.92);
}
.cover-cat{
  font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  padding:4px 10px; border-radius:999px;
  background:rgba(255,255,255,.18); backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.25);
}
.cover-len{
  font-family:var(--font-en); font-size:11px; letter-spacing:.1em; font-weight:600;
  padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.14);
  border:1px solid rgba(255,255,255,.18);
}
.cover-num{
  position:absolute; right:12px; bottom:8px;
  font-family:var(--font-en); font-size:38px; font-weight:700; line-height:1;
  color:rgba(255,255,255,.2); letter-spacing:.02em;
}
.cover-title{
  position:absolute; left:18px; right:62px; bottom:14px;
  font-family:var(--font-en); font-weight:600; font-size:16.5px; line-height:1.35;
  color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.25);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.cover-title .cn{
  display:block; font-family:var(--font-zh); font-weight:600; font-size:12.5px;
  margin-top:4px; opacity:.92; letter-spacing:.02em;
}
.book-body{padding:16px 18px 18px; flex:1; display:flex; flex-direction:column}
.book-intro{
  font-size:13.5px; color:var(--text-2); line-height:1.75; flex:1;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.book-foot{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
}
.book-words{font-family:var(--font-en); font-size:12.5px; color:var(--text-3)}
.book-arrow{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface-2); color:var(--text-2); transition:all .25s var(--ease);
}
.book-arrow svg{width:15px; height:15px}
.book-card:hover .book-arrow{background:var(--accent); color:#fff; transform:translateX(3px)}
.book-flag{
  position:absolute; top:14px; right:14px; z-index:3;
  display:flex; gap:5px; align-items:center;
  background:rgba(20,26,24,.55); backdrop-filter:blur(6px);
  color:#fff; font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
}
.book-flag svg{width:12px; height:12px}
.book-new{
  position:absolute; top:14px; right:14px; z-index:3;
  font-size:11px; font-weight:700; letter-spacing:.14em;
  color:#fff; background:var(--accent); padding:5px 10px; border-radius:999px;
  box-shadow:0 4px 10px rgba(62,124,111,.4);
}
.empty{
  text-align:center; padding:90px 20px; color:var(--text-3);
}
.empty svg{width:52px; height:52px; opacity:.4; margin-bottom:16px}
.empty p{font-size:15px; margin-bottom:6px}
.empty .sub{font-size:13px; opacity:.8}

/* ============ 阅读页 ============ */
.article-wrap{max-width:calc(var(--read-w) + 120px); margin:0 auto; padding:0 24px 100px}
.article-head{padding:44px 0 8px}
.art-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.art-cat{
  font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; padding:5px 12px; border-radius:999px;
}
.art-len{font-family:var(--font-en); font-size:12.5px; color:var(--text-3); letter-spacing:.06em}
.art-date{font-family:var(--font-en); font-size:12.5px; color:var(--text-3)}
.art-dot{width:4px; height:4px; border-radius:50%; background:var(--line-strong)}
.art-title{
  font-family:var(--font-en); font-weight:700; color:var(--text);
  font-size:clamp(26px, 4vw, 38px); line-height:1.32; margin:18px 0 0; letter-spacing:-.01em;
}
.art-title-cn{
  font-family:var(--font-zh); font-size:clamp(17px, 2.4vw, 21px); color:var(--text-2);
  margin-top:14px; line-height:1.6; font-weight:600; letter-spacing:.04em;
  padding-bottom:22px; border-bottom:1px solid var(--line);
}
.art-lead{
  margin:26px 0 0; padding:20px 24px; border-radius:var(--r-md);
  background:var(--accent-soft); border-left:3px solid var(--accent);
  color:var(--text); font-size:14.5px; line-height:1.9;
}
.art-lead .lead-tag{
  display:block; font-family:var(--font-ui); font-size:11.5px; font-weight:700;
  letter-spacing:.2em; color:var(--accent-ink); margin-bottom:8px;
}
.read-toolbar{
  display:flex; align-items:center; gap:10px; margin:24px 0 6px; padding:10px 14px;
  border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line);
  position:sticky; top:78px; z-index:20; backdrop-filter:blur(8px);
}
.read-toolbar .rt-label{font-size:12.5px; color:var(--text-3); margin-right:2px; white-space:nowrap}
.rt-btn{
  width:32px; height:32px; border-radius:9px; display:grid; place-items:center;
  color:var(--text-2); border:1px solid var(--line); background:var(--bg-soft);
  transition:all .2s var(--ease);
}
.rt-btn:hover{color:var(--accent-ink); border-color:var(--accent)}
.rt-btn svg{width:15px; height:15px}
.rt-size{font-family:var(--font-en); font-size:13px; color:var(--text-2); min-width:44px; text-align:center}
.rt-spacer{flex:1}
.rt-addword{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  color:var(--accent-ink); background:var(--accent-soft); padding:7px 13px; border-radius:999px;
  transition:all .2s var(--ease); white-space:nowrap;
}
.rt-addword:hover{background:var(--accent); color:#fff}
.rt-addword svg{width:14px; height:14px}
.rt-done{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  color:var(--text-3); padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  transition:all .2s var(--ease); white-space:nowrap;
}
.rt-done.on{color:var(--accent-ink); background:var(--accent-soft); border-color:transparent}
.rt-done svg{width:14px; height:14px}

.article-body{
  margin-top:14px;
  font-family:var(--font-en); color:var(--text);
  font-size:var(--fs-body, 18.5px);
  line-height:var(--lh-body, 1.95);
  letter-spacing:.01em;
}
.article-body p{
  margin:0 0 var(--ps-body, 1.35em);
  text-align:left;
  word-break:break-word;
  position:relative;
}
.article-body .art-subtitle{
  font-family:var(--font-en); font-weight:600; font-size:1.12em; color:var(--text);
  margin-top:1.6em; margin-bottom:.9em;
}
.article-body .en-word{cursor:pointer; border-radius:4px; transition:background .18s, color .18s, box-shadow .18s}
.article-body .en-word:hover{background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft)}
.article-body .en-word.hit{background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); color:var(--accent-ink)}
.art-foot{
  margin-top:44px; padding-top:26px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
}
.art-foot .back-btn{
  display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600;
  color:var(--accent-ink); background:var(--accent-soft); padding:10px 18px; border-radius:999px;
  transition:all .22s var(--ease);
}
.art-foot .back-btn:hover{background:var(--accent); color:#fff}
.art-foot .back-btn svg{width:15px; height:15px}
.art-vocab{
  margin-top:14px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); padding:20px 22px;
}
.vocab-title{
  font-family:var(--font-ui); font-size:13px; font-weight:700; letter-spacing:.14em;
  color:var(--accent-ink); margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.vocab-title svg{width:16px; height:16px}
.vocab-list{display:grid; grid-template-columns:1fr 1fr; gap:8px 26px}
@media(max-width:560px){ .vocab-list{grid-template-columns:1fr} }
.vocab-item{
  padding:10px 12px; border-radius:10px; background:var(--bg-soft);
  display:flex; gap:10px; align-items:baseline; cursor:pointer;
  transition:background .2s var(--ease);
}
.vocab-item:hover{background:var(--accent-soft)}
.vocab-item .vw{font-family:var(--font-en); font-weight:600; color:var(--text); font-size:15px}
.vocab-item .vp{font-family:var(--font-en); font-style:italic; color:var(--accent); font-size:12px; flex-shrink:0}
.vocab-item .vd{font-size:13px; color:var(--text-2); line-height:1.6}

/* ============ 生词本 ============ */
.words-head{padding:26px 0 22px}
.words-title{font-family:var(--font-zh); font-weight:900; font-size:30px; color:var(--text)}
.words-sub{color:var(--text-2); font-size:14px; margin-top:8px; line-height:1.8}
.words-stats{
  display:flex; gap:12px; margin:20px 0 26px; flex-wrap:wrap;
}
.stat-chip{
  flex:1; min-width:150px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); padding:16px 20px; box-shadow:var(--shadow);
}
.stat-chip .n{font-family:var(--font-en); font-weight:700; font-size:26px; color:var(--accent-ink); line-height:1.1}
.stat-chip .l{font-size:12.5px; color:var(--text-3); margin-top:5px; letter-spacing:.06em}
.words-list{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:760px){ .words-list{grid-template-columns:1fr} }
.word-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:16px 18px; box-shadow:var(--shadow); transition:all .22s var(--ease);
  display:flex; gap:14px; align-items:flex-start;
}
.word-card:hover{border-color:var(--accent)}
.wc-main{flex:1; min-width:0}
.wc-word{font-family:var(--font-en); font-weight:600; font-size:17px; color:var(--text)}
.wc-pos{font-family:var(--font-en); font-style:italic; color:var(--accent); font-size:12px; margin-left:8px}
.wc-def{font-size:13.5px; color:var(--text-2); margin-top:5px; line-height:1.65}
.wc-from{font-size:11.5px; color:var(--text-3); margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wc-del{
  width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  color:var(--text-3); transition:all .2s var(--ease); flex-shrink:0;
}
.wc-del:hover{background:#F3E2DE; color:#B05A4A}
.wc-del svg{width:15px; height:15px}
.wc-learned{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--accent-ink); background:var(--accent-soft); padding:4px 9px; border-radius:999px; margin-top:8px}
.wc-learned svg{width:11px; height:11px}

/* ============ 顶部查词浮层 ============ */
.dict-bar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  transform:translateY(-110%); transition:transform .34s var(--ease);
}
.dict-bar.show{transform:none}
.dict-inner{
  max-width:680px; margin:14px auto 0; padding:0 20px;
}
.dict-card{
  background:var(--dict-bg); border:1px solid var(--dict-border);
  border-radius:var(--r-md); box-shadow:0 16px 50px rgba(0,0,0,.22);
  padding:16px 20px 15px; position:relative;
}
.dict-card::after{
  content:''; position:absolute; left:34px; bottom:-8px; width:14px; height:14px;
  background:var(--dict-bg); border-right:1px solid var(--dict-border); border-bottom:1px solid var(--dict-border);
  transform:rotate(45deg); border-radius:2px;
}
.dict-wordline{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.dict-word{font-family:var(--font-en); font-weight:700; font-size:22px; color:var(--accent-ink); line-height:1.2}
.dict-pos{font-family:var(--font-en); font-style:italic; font-size:13px; color:var(--accent)}
.dict-phon{font-family:var(--font-en); font-size:13px; color:var(--text-3)}
.dict-def{font-size:15px; color:var(--text); line-height:1.7; margin-top:9px}
.dict-source{font-size:11.5px; color:var(--text-3); margin-top:10px}
.dict-actions{display:flex; gap:8px; margin-top:13px; align-items:center}
.dict-btn{
  display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
  padding:8px 15px; border-radius:999px; transition:all .2s var(--ease);
}
.dict-btn.add{color:#fff; background:var(--accent); box-shadow:0 4px 12px rgba(62,124,111,.3)}
.dict-btn.add:hover{background:var(--accent-ink)}
.dict-btn.add.done{background:var(--surface-2); color:var(--text-2); box-shadow:none}
.dict-btn.add svg{width:14px; height:14px}
.dict-hint{font-size:12.5px; color:var(--text-3); margin-left:auto}
.dict-close{
  position:absolute; right:12px; top:12px; width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; color:var(--text-3); transition:all .2s;
}
.dict-close:hover{background:var(--surface-2); color:var(--text)}
.dict-close svg{width:14px; height:14px}

/* ============ 进度条 ============ */
.progress-rail{
  position:fixed; top:0; left:0; right:0; height:3px; z-index:120; pointer-events:none;
}
.progress-rail i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  transition:width .15s linear;
}

/* ============ Toast ============ */
.toast-wrap{
  position:fixed; bottom:34px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:200; opacity:0; pointer-events:none; transition:all .3s var(--ease);
}
.toast-wrap.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast{
  background:var(--text); color:var(--bg); font-size:13.5px; font-weight:500;
  padding:12px 22px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.25);
  white-space:nowrap; max-width:86vw; overflow:hidden; text-overflow:ellipsis;
}

/* ============ 页脚 ============ */
.footer{
  border-top:1px solid var(--line); padding:30px 28px 40px; text-align:center;
  color:var(--text-3); font-size:12.5px; line-height:2;
  background:var(--bg-deep);
}
.footer b{color:var(--text-2); font-weight:600}
.footer .f-en{font-family:var(--font-en); letter-spacing:.18em; text-transform:uppercase; font-size:11px; color:var(--accent-2)}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .topbar-inner{padding:0 18px; height:60px; gap:14px}
  .search-box input{width:0; padding:0; border:none; background:transparent; position:absolute; right:0; opacity:0}
  .search-box input:focus{width:240px; opacity:1; background:var(--surface); border:1px solid var(--line); padding:0 14px 0 38px; position:static}
  .search-box.active{position:static; flex:1}
  .search-box.active input{position:static; width:100%; opacity:1; background:var(--surface); border:1px solid var(--line); padding:0 14px 0 38px}
  .nav-btn{padding:8px 12px; font-size:13px}
  .brand-sub{display:none}
  .hero{padding:34px 0 22px}
  .hero-date{text-align:left; width:100%}
  .container{padding:26px 18px 60px}
}
@media(max-width:520px){
  .pill{padding:10px 15px; font-size:13.5px}
  .dict-btn{font-size:13.5px; padding:9px 16px}
  .brand-name{font-size:15px; letter-spacing:.08em}
  .top-actions .icon-btn{width:34px; height:34px}
  .nav{order:5; width:100%; overflow-x:auto; padding-bottom:8px; margin-top:2px; -webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .topbar-inner{flex-wrap:wrap; height:auto; padding-top:8px; padding-bottom:8px; gap:8px}
  .grid{gap:18px}
  .art-title{font-size:25px}
  .article-body{font-size:var(--fs-body, 17.5px)}
  .read-toolbar{flex-wrap:wrap}
}

/* ============ 动效偏好 ============ */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .view{animation:none!important}
  *{transition-duration:.01ms!important; animation-duration:.01ms!important}
}
</style>

<script>
/* ============================================================

/* 由 GitHub Actions 每天烧录当天日期（自我更新）；本地打开时为空白，前端回退到浏览器日期 */
const TODAY_OVERRIDE = '2026-10-26';
const ARTICLES = [{"id":"01","date":"2026-10-18","category":"news","len":"short","title":"The City That Learned to Farm Its Own Roofs","cn":"屋顶上的农场：一座城市的食物革命","intro":"当城市的土地越来越贵，人们把菜园搬上了屋顶。这座城市的经验告诉我们：粮食不一定要从千里之外运来。","words":212,"paras":[{"t":"p","c":"On a weekday morning in mid-October, a group of office workers in downtown Shanghai gathered on a rooftop eleven stories above the street. They were not there for coffee or a meeting. They were harvesting tomatoes, basil and cucumbers from rows of raised beds that turn an unused rooftop into a working farm."},{"t":"p","c":"The rooftop farm is part of a quiet movement that has been spreading through Chinese cities over the past five years. As land prices rise and farmland shrinks near urban centers, planners have begun to look upward for solutions. A typical office building, they argue, carries thousands of square meters of flat, unused surface that could grow fresh food within walking distance of the people who eat it."},{"t":"p","c":"Supporters say rooftop agriculture cuts transport costs, reduces food waste and lowers indoor temperatures in summer. Critics remain cautious: maintenance is heavy, yields are modest, and not every building can bear the weight of soil and water. Still, the trend keeps growing. Last year, the city added more than forty new rooftop gardens, and a local supermarket chain now buys vegetables directly from them."},{"t":"p","c":"Perhaps the most surprising result is cultural rather than commercial. Office workers who once saw food only as packages on a shelf now pause at lunch to check whether the seedlings have grown. In a dense city, the rooftop farm offers something rarer than vegetables: a small patch of sky and soil, shared by strangers who water it together."}],"vocab":[{"w":"rooftop","pos":"n.","def":"屋顶，楼顶"},{"w":"harvest","pos":"v.","def":"收获，收割"},{"w":"movement","pos":"n.","def":"运动，潮流"},{"w":"shrink","pos":"v.","def":"缩小，减少"},{"w":"planner","pos":"n.","def":"规划者"},{"w":"cautious","pos":"adj.","def":"谨慎的，小心的"},{"w":"modest","pos":"adj.","def":"适度的，不大的"},{"w":"yield","pos":"n.","def":"产量，收成"},{"w":"dense","pos":"adj.","def":"密集的，稠密的"},{"w":"seedling","pos":"n.","def":"幼苗，秧苗"}]},{"id":"02","date":"2026-10-16","category":"news","len":"medium","title":"Driverless Taxis Are Quietly Becoming Normal","cn":"无人出租车：正在悄悄变得平常","intro":"从猎奇到日常，无人驾驶出租车只用了三年。它改变了城市的出行，也改变了人们对\"驾驶\"这件事的理解。","words":352,"paras":[{"t":"p","c":"Three years ago, a driverless taxi was a curiosity. Passengers took photos, posted them online and treated the ride as a small adventure. Today, in several Chinese cities, it has become part of the daily commute: you order it like any other ride, a car arrives with no one in the front seat, and nobody on the street turns to stare."},{"t":"p","c":"The technology behind the change has matured quietly. Newer models rely on fewer sensors but better software, reading the road with a confidence that once seemed impossible. Safety records have improved steadily, and regulators have responded with clearer rules rather than blanket bans."},{"t":"p","c":"Yet the most interesting shift is not technological but social. Surveys show that passengers now care less about whether a car has a driver and more about whether it arrives on time and drives smoothly. Comfort, it turns out, matters more than novelty. Some riders even report feeling more relaxed without a stranger in the car, free to talk, work or simply watch the city pass by."},{"t":"p","c":"For the industry, the transition brings both opportunity and pain. Ride-hailing drivers face uncertain futures, and cities must decide how to retrain a workforce that powered mobility for decades. Few expect the change to be reversed. The question is no longer whether driverless taxis will arrive, but how quickly, and at whose cost."},{"t":"p","c":"Seen from a window seat, the change is gentle. A car glides to the curb, doors open automatically, and the passenger climbs in without a second thought. What was science fiction at the start of the decade has become, in the words of one engineer, \"just another part of the city, like traffic lights or bus stops.\""}],"vocab":[{"w":"curiosity","pos":"n.","def":"新奇的事物，好奇心"},{"w":"commute","pos":"n.","def":"通勤，上下班路程"},{"w":"mature","pos":"v.","def":"成熟，发展完善"},{"w":"sensor","pos":"n.","def":"传感器"},{"w":"blanket","pos":"adj.","def":"全面的，总括的（blanket ban 全面禁止）"},{"w":"regulator","pos":"n.","def":"监管机构"},{"w":"novelty","pos":"n.","def":"新奇，新鲜感"},{"w":"transition","pos":"n.","def":"过渡，转变"},{"w":"retrain","pos":"v.","def":"再培训，重新训练"},{"w":"glide","pos":"v.","def":"滑行，平稳移动"},{"w":"reverse","pos":"v.","def":"逆转，推翻"}]},{"id":"03","date":"2026-10-14","category":"news","len":"short","title":"What the Deep Sea Is Telling Us About Our Trash","cn":"深海正在告诉我们：垃圾去了哪里","intro":"科学家在八千米深的马里亚纳海沟里发现了塑料袋。海洋最安静的地方，也未能幸免。","words":206,"paras":[{"t":"p","c":"At the bottom of the Mariana Trench, eight thousand meters below the surface, where light never reaches and the pressure would crush a submarine, researchers have found something unexpected: plastic. A single plastic bag, filmed by a deep-sea robot, drifting slowly across the dark floor."},{"t":"p","c":"The discovery is not merely symbolic. New studies estimate that between eight and fourteen million tons of plastic enter the ocean every year, and the deepest trenches act as final resting places for a large share of it. Once there, plastic breaks down slowly into tiny fragments that enter the food chain of creatures that have never seen the surface."},{"t":"p","c":"Scientists point out that the deep sea is not a distant problem but a storage room for our own habits. Nearly every piece of plastic ever produced still exists somewhere on the planet. The ocean keeps the account."},{"t":"p","c":"The fix is unglamorous: fewer single-use products, better recycling, and rivers that no longer carry waste to the sea. There is no easy cleanup for the deep ocean. The best we can do, researchers say, is to stop adding to the pile and let the slow machinery of nature do the rest."}],"vocab":[{"w":"trench","pos":"n.","def":"海沟，沟渠"},{"w":"crush","pos":"v.","def":"压碎，压垮"},{"w":"symbolic","pos":"adj.","def":"象征性的"},{"w":"estimate","pos":"v.","def":"估计，估算"},{"w":"fragment","pos":"n.","def":"碎片，片段"},{"w":"creature","pos":"n.","def":"生物，动物"},{"w":"unglamorous","pos":"adj.","def":"平淡无奇的，不吸引人的"},{"w":"recycling","pos":"n.","def":"回收利用"},{"w":"machinery","pos":"n.","def":"机制，机器"}]},{"id":"04","date":"2026-10-12","category":"news","len":"medium","title":"The Heat Is On: Why Cities Feel Hotter Than the Map Says","cn":"热浪之下：为什么城市比地图显示的更热","intro":"同一个夏天，公园和马路可能相差五度。城市热岛效应正悄悄改写我们的生活半径。","words":340,"paras":[{"t":"p","c":"Meteorologists will tell you that a heat wave is measured in degrees and dates. But walk across any large city during a summer afternoon and you will feel a different kind of truth: the pavement burns through your shoes, the air between tall buildings thickens, and every tree-lined street offers a relief that the official forecast never mentions."},{"t":"p","c":"This is the urban heat island effect, and it is not a minor detail. Studies in dozens of cities show that built-up areas can run five to eight degrees Celsius warmer than surrounding countryside on the same day. Concrete and asphalt absorb the sun's energy and release it slowly at night, so cities cool down far more slowly than fields and forests."},{"t":"p","c":"The consequences go beyond discomfort. Heat increases energy bills as air conditioners work harder, raises the risk of health problems among the elderly and the young, and even changes behavior: in the hottest months, people simply stay indoors, and the streets grow quiet."},{"t":"p","c":"Solutions exist and are surprisingly traditional. More trees, lighter-colored roofs, green spaces that break up concrete, and shade structures along busy sidewalks can all reduce the effect measurably. Some cities have begun planting tens of thousands of trees with exactly this goal in mind."},{"t":"p","c":"Heat, it turns out, is not only a matter of weather. It is also a matter of design. The same sun falls on every part of the city; what differs is how each block chooses to meet it."}],"vocab":[{"w":"meteorologist","pos":"n.","def":"气象学家"},{"w":"pavement","pos":"n.","def":"人行道，路面"},{"w":"thicken","pos":"v.","def":"变浓，变稠，变厚"},{"w":"relief","pos":"n.","def":"缓解，宽慰"},{"w":"concrete","pos":"n.","def":"混凝土"},{"w":"asphalt","pos":"n.","def":"沥青"},{"w":"consequence","pos":"n.","def":"后果，结果"},{"w":"measurably","pos":"adv.","def":"可测量地，显著地"},{"w":"shade","pos":"n.","def":"阴凉处，遮蔽"},{"w":"sidewalk","pos":"n.","def":"人行道"}]},{"id":"05","date":"2026-10-10","category":"news","len":"short","title":"The Quiet Comeback of Paper Books","cn":"纸质书的安静回归","intro":"在电子阅读盛行的十年后，纸质书的销量悄悄回升。人们重新发现了翻页的快乐。","words":198,"paras":[{"t":"p","c":"For a decade, the future of reading seemed certain: screens would replace paper, and bookstores would follow the fate of video stores. The prediction has not come true. Sales of physical books have been climbing steadily in many countries, and young readers are leading the rebound."},{"t":"p","c":"Publishers offer several explanations. A printed book makes no notifications, asks for no battery and cannot be interrupted by a message. It also creates a clearer sense of progress: the growing stack of pages on the left side of the spine tells you exactly how far you have come."},{"t":"p","c":"Researchers have found that people tend to remember more from paper reading than from screen reading, especially when it comes to long texts. The physical map of a book, its chapters and margins, seems to anchor memories in a way that endless scrolling does not."},{"t":"p","c":"The comeback is not a rejection of technology but a rediscovery of a particular kind of focus. Screens are still the fastest way to find information; books are still the most pleasant way to lose yourself in it."}],"vocab":[{"w":"comeback","pos":"n.","def":"回归，东山再起"},{"w":"prediction","pos":"n.","def":"预测"},{"w":"rebound","pos":"n.","def":"反弹，回升"},{"w":"notification","pos":"n.","def":"通知，提醒"},{"w":"spine","pos":"n.","def":"书脊"},{"w":"anchor","pos":"v.","def":"固定，锚定"},{"w":"scroll","pos":"v.","def":"滚动，翻屏"},{"w":"rejection","pos":"n.","def":"拒绝，排斥"},{"w":"rediscovery","pos":"n.","def":"重新发现"}]},{"id":"06","date":"2026-10-08","category":"story","len":"long","title":"The Night Watchman of the Last Bookstore","cn":"最后一家书店的守夜人","intro":"城市改造带走了整条街的店铺，只剩这家旧书店。守夜人老陈说：书在，这条街的记忆就在。","words":486,"paras":[{"t":"p","c":"The street used to be famous for its bookstores. Forty years ago, over thirty shops sold books, prints and old magazines along its two blocks, and students came from across the city to browse on weekends. Today, only one remains: the Chen family bookstore, a narrow two-story building with a faded green sign."},{"t":"p","c":"Chen Ming, the owner, is sixty-three now. He took over the shop from his father in 1988, when business was still good, and has watched every wave of change since: the rise of big chain stores, the arrival of the internet, the decade when online discounts seemed certain to finish off shops like his, and then, unexpectedly, the slow return of customers who wanted something more than a delivery box."},{"t":"p","c":"He opens at nine in the morning and closes at ten at night, but the real life of the shop begins after dark. That is when the regulars come: a retired teacher who reads philosophy in the corner, a young nurse who buys one poetry book every month, a delivery rider who stops by to rest and always leaves with a paperback novel."},{"t":"p","c":"Chen knows most of them by name, and he keeps a small notebook behind the counter in which he records, year after year, what each regular reads. \"People think a bookstore sells books,\" he says. \"But actually it stores time. The same person returns, the same chair, and the books change as their life changes. You can read a person's whole story just by watching what they reach for.\""},{"t":"p","c":"When the city announced the renovation plan four years ago, everyone expected the street to be demolished. Chen refused to move. He signed nothing, accepted no offer, and let the negotiations drag on until the plan quietly changed. \"I am not brave,\" he admits. \"I am just stubborn. Someone has to keep the light on.\""},{"t":"p","c":"Tonight, as usual, he is arranging the window display: a stack of new novels, a row of poetry collections, and a single hardcover edition of a classic, placed upright like a small monument. The street outside is quiet. The old neon signs of other shops are dark. But the window of the Chen family bookstore still glows, warm and yellow, a lighthouse for anyone who still reads."},{"t":"p","c":"A young man in a school uniform stops at the window, hesitates, then pushes the door open. The bell rings. Chen looks up and smiles. \"Come in,\" he says. \"The new books arrived this morning.\""}],"vocab":[{"w":"watchman","pos":"n.","def":"守夜人，看守人"},{"w":"faded","pos":"adj.","def":"褪色的，暗淡的"},{"w":"browse","pos":"v.","def":"浏览，翻阅"},{"w":"chain","pos":"n.","def":"连锁（chain stores 连锁店）"},{"w":"discount","pos":"n.","def":"折扣"},{"w":"regular","pos":"n.","def":"常客"},{"w":"philosophy","pos":"n.","def":"哲学"},{"w":"paperback","pos":"n.","def":"平装书"},{"w":"renovation","pos":"n.","def":"翻新，改造"},{"w":"demolish","pos":"v.","def":"拆除，摧毁"},{"w":"stubborn","pos":"adj.","def":"固执的，倔强的"},{"w":"monument","pos":"n.","def":"纪念碑，纪念物"},{"w":"lighthouse","pos":"n.","def":"灯塔"}]},{"id":"07","date":"2026-10-06","category":"story","len":"medium","title":"The Cellist in the Subway","cn":"地铁里的大提琴手","intro":"每天傍晚六点，她准时出现在地铁通道的拐角。没有人知道她为什么在那里，直到有一天她缺席了。","words":348,"paras":[{"t":"p","c":"At exactly six o'clock every evening, the sound of a cello begins to rise from the underground passage near Exit C. It is the same passage where commuters rush past every day, and for most of them the music is just part of the background noise, like the hum of escalators and the announcements overhead."},{"t":"p","c":"The musician is a young woman in her late twenties. She never plays popular songs, only pieces by composers whose names most listeners would not recognize. She places a small cardboard box on the ground with a few coins in it, but she never looks at it while she plays, keeping her eyes on the instrument as if the music were a private conversation."},{"t":"p","c":"No one knows her real name. The regular commuters call her the cellist, and over two years she has become a fixed part of their evening: a brief moment of calm between the office and the long ride home. Some people slow down to listen for a minute. A few leave coins. Most simply pass, and that is fine."},{"t":"p","c":"Then, one Tuesday, she did not appear. The passage felt strangely empty. Commuters noticed in the way you notice a missing sign you had never read. The next day she was absent again, and the day after that."},{"t":"p","c":"On Friday, a printed note was taped to the wall where she used to sit. It said, in careful handwriting: \"Thank you for two years. I have been offered a place at a conservatory abroad, which I never believed would happen. I will come back someday and play again at the same corner. Until then, please be kind to the other musicians you meet.\""},{"t":"p","c":"The note stayed on the wall for weeks. Nobody removed it. Beneath it, people began leaving small things: a dried flower, a subway ticket, a coin. The passage had never been quieter, and somehow never warmer."}],"vocab":[{"w":"cello","pos":"n.","def":"大提琴"},{"w":"passage","pos":"n.","def":"通道，走廊"},{"w":"commuter","pos":"n.","def":"通勤者"},{"w":"hum","pos":"n.","def":"嗡嗡声，低沉声"},{"w":"escalator","pos":"n.","def":"自动扶梯"},{"w":"composer","pos":"n.","def":"作曲家"},{"w":"cardboard","pos":"adj.","def":"纸板的"},{"w":"instrument","pos":"n.","def":"乐器，仪器"},{"w":"conservatory","pos":"n.","def":"音乐学院，温室"},{"w":"dried","pos":"adj.","def":"干枯的，干燥的"}]},{"id":"08","date":"2026-10-04","category":"story","len":"short","title":"The Letter That Traveled Twenty Years","cn":"一封走了二十年的信","intro":"邮递员在山村小学的旧抽屉里发现了一封未寄出的信。他决定替陌生人完成这件小事。","words":214,"paras":[{"t":"p","c":"The envelope had no stamp and no address, only a name written in careful blue ink: \"To my friend Li, who moved away in the summer of 2005.\" It had been sitting in a drawer of the old primary school for twenty years, forgotten when the teacher who kept it retired."},{"t":"p","c":"Zhou Wen, the village postman, found it while helping to clear out the school building. He could have thrown it away, but the handwriting stopped him. Instead, he began to ask around. The village is small, and memories are long: within a week, he learned that the letter's author was an old woman who had passed away, and that Li, the intended reader, now ran a teahouse in the county town."},{"t":"p","c":"Zhou rode his motorbike forty kilometers to deliver it in person. The teahouse owner, a gray-haired man in his fifties, read the letter slowly, twice, and then sat in silence for a long time."},{"t":"p","c":"\"We were classmates,\" he said finally. \"I never knew she wrote to me. Twenty years late, and it still got here.\" He folded the letter carefully and placed it in his wallet. \"Some things don't have an expiration date.\""}],"vocab":[{"w":"envelope","pos":"n.","def":"信封"},{"w":"stamp","pos":"n.","def":"邮票，印章"},{"w":"retired","pos":"v.","def":"退休"},{"w":"postman","pos":"n.","def":"邮递员"},{"w":"clear out","pos":"phr.","def":"清理，清空"},{"w":"teahouse","pos":"n.","def":"茶馆"},{"w":"gray-haired","pos":"adj.","def":"头发花白的"},{"w":"fold","pos":"v.","def":"折叠"},{"w":"expiration","pos":"n.","def":"到期，期满"}]},{"id":"09","date":"2026-10-02","category":"story","len":"medium","title":"The Old Man Who Planted Trees in the Desert","cn":"在沙漠里种树的老人","intro":"二十年，一个人，两万棵树。他不用手机，不上新闻，只是每天清晨扛着铁锹走向沙丘。","words":366,"paras":[{"t":"p","c":"The first time the researchers saw him, they thought he was lost. An old man in a sun hat, walking across the sand with a shovel over his shoulder, heading toward a range of low dunes where nothing could possibly grow. They were a team studying desert expansion; he was a farmer named Guo, sixty-eight years old, and he had been walking that same route every morning for the past twenty years."},{"t":"p","c":"Guo began planting trees in his fifties, after the sand crept over the fields his family had farmed for generations. \"The desert is patient,\" he told the researchers. \"It takes one grain of soil at a time. So I decided to be patient too, and give it back one seedling at a time.\""},{"t":"p","c":"At first almost everything died. The wind buried his saplings, the heat killed the roots, and the villagers called him a fool. He did not argue. He simply changed his methods, learning which grass to plant first to hold the sand, which trees could survive on the driest patches, and how to carry water in small, frequent trips rather than one heavy load."},{"t":"p","c":"Year by year, the desert gave ground. Small green belts appeared where there had been bare sand. Birds returned, then insects, then a thin layer of soil that had not existed for decades. The researchers' satellite images showed a darkening patch of land that had no explanation except one stubborn old man."},{"t":"p","c":"When they asked him why he kept going, Guo shrugged. \"Someone has to start,\" he said. \"I won't live to see the forest I am planting. My grandchildren will. That is enough.\""},{"t":"p","c":"The government eventually registered his land as a protected green area and sent young volunteers to help. Guo now teaches them the craft he learned from failure: plant the grass first, the trees second, and never expect the desert to forgive a careless season. The volunteers call him Teacher Guo. He calls them the future."},{"t":"p","c":"On the morning the research team left, they saw him once more, walking toward the dunes with his shovel. The sun was still low. His shadow stretched long across the sand, and behind him, green rows of young trees stood in the wind like a quiet army."}],"vocab":[{"w":"shovel","pos":"n.","def":"铁锹，铲子"},{"w":"dune","pos":"n.","def":"沙丘"},{"w":"expansion","pos":"n.","def":"扩张，扩大"},{"w":"creep","pos":"v.","def":"爬行，蔓延"},{"w":"sapling","pos":"n.","def":"树苗"},{"w":"patch","pos":"n.","def":"小块土地，斑点"},{"w":"bare","pos":"adj.","def":"光秃的，裸露的"},{"w":"satellite","pos":"n.","def":"卫星"},{"w":"stubborn","pos":"adj.","def":"固执的，顽强的"},{"w":"shrug","pos":"v.","def":"耸肩"},{"w":"registered","pos":"v.","def":"登记，注册"},{"w":"volunteer","pos":"n.","def":"志愿者"},{"w":"craft","pos":"n.","def":"手艺，技艺"}]},{"id":"10","date":"2026-09-30","category":"story","len":"short","title":"The Breakfast Stall at Four in the Morning","cn":"凌晨四点的早餐摊","intro":"城市还在沉睡时，巷口的早餐摊已经亮起了灯。摊主说：我的客人是这座城市最早醒着的人。","words":208,"paras":[{"t":"p","c":"The city is still dark when the light comes on above the breakfast stall at the mouth of the alley. By four thirty, the steam is rising from the pots, and the first customers are already arriving: taxi drivers starting their shifts, nurses coming off night duty, market vendors heading to the wholesale hall."},{"t":"p","c":"The stall has been here for nineteen years, run by the same woman, Auntie Lin. She knows the rhythm of the early hours better than anyone: the quiet lull just before five, the rush between five thirty and six, the slow fade after the sun rises and ordinary people begin their day."},{"t":"p","c":"\"Most people think the city wakes up when they wake up,\" she says, ladling soup into a bowl. \"But it never sleeps. Somebody has to drive the buses, guard the buildings, sweep the streets. My stall is just where those people stop to be human for a few minutes.\""},{"t":"p","c":"She remembers the faces better than the orders. The driver who used to bring his son, now grown and gone to college. The night-shift nurse who always asks for extra ginger on cold mornings. \"You don't get rich running a breakfast stall,\" she says. \"But you get to watch a whole neighborhood grow up, and that's a salary no bank can pay.\""}],"vocab":[{"w":"stall","pos":"n.","def":"摊位，货摊"},{"w":"alley","pos":"n.","def":"小巷，胡同"},{"w":"steam","pos":"n.","def":"蒸汽，水汽"},{"w":"vendor","pos":"n.","def":"小贩，摊贩"},{"w":"wholesale","pos":"adj.","def":"批发的"},{"w":"rhythm","pos":"n.","def":"节奏，韵律"},{"w":"lull","pos":"n.","def":"间歇，平静期"},{"w":"ladle","pos":"v.","def":"（用勺）舀"},{"w":"ginger","pos":"n.","def":"姜"},{"w":"neighborhood","pos":"n.","def":"街区，社区"}]},{"id":"11","date":"2026-09-28","category":"story","len":"medium","title":"The Last Train From the Old Station","cn":"老火车站的最后一班列车","intro":"新高铁站启用那天，运营了六十年的老站发出最后一班车。站台上的人们，为一段时代送了行。","words":358,"paras":[{"t":"p","c":"At 11:40 on a Sunday night, the last train pulled out of the old station. It was an ordinary green train, the kind that had been running the same route for sixty years, and it was carrying 214 passengers, many of whom had simply come to be part of the farewell."},{"t":"p","c":"The station had once been the busiest in the province. People met lovers there, left for university there, and returned from years of work there. The concrete floor was worn smooth in the middle by millions of footsteps. The wooden benches had been painted so many times that their original shape was barely visible."},{"t":"p","c":"The new high-speed station, twelve kilometers away, now handles the route in forty minutes instead of three hours. Nobody argues with progress. But progress does not erase memory by itself; people have to let go, and letting go takes a ceremony."},{"t":"p","c":"So they came that night. An old couple who had met on platform two in 1978, holding hands without saying much. A young father carrying his daughter to see \"the train of grandpa's childhood.\" A retired stationmaster in his uniform, standing at attention as the train passed, saluting a clock that would never tell time again."},{"t":"p","c":"The conductor, a woman who had worked the route for thirty years, stood by the door as the train rolled slowly into the dark. \"Every night,\" she said, \"I used to look out and see the lights of the town. Tonight they're the same lights. But somehow I know I won't see them like this again.\""},{"t":"p","c":"The train disappeared around the bend. The platform stayed full for a long time. Then, one by one, people walked out under the pale lamps, leaving the old station to the silence it had earned. Behind them, the big clock had stopped at 11:40, and someone had hung a small note beneath it: \"Thank you, old friend.\""}],"vocab":[{"w":"pull out","pos":"phr.","def":"（火车）出站，驶离"},{"w":"farewell","pos":"n.","def":"告别，辞行"},{"w":"worn","pos":"adj.","def":"磨损的，用旧的"},{"w":"bench","pos":"n.","def":"长椅，长凳"},{"w":"barely","pos":"adv.","def":"几乎不，勉强"},{"w":"erase","pos":"v.","def":"抹去，擦除"},{"w":"ceremony","pos":"n.","def":"仪式，典礼"},{"w":"stationmaster","pos":"n.","def":"站长"},{"w":"salute","pos":"v.","def":"敬礼，致敬"},{"w":"conductor","pos":"n.","def":"列车员，指挥"},{"w":"bend","pos":"n.","def":"转弯处，弯道"},{"w":"pale","pos":"adj.","def":"暗淡的，苍白的"}]},{"id":"12","date":"2026-09-26","category":"story","len":"short","title":"The Flower Shop That Opened Among Ruins","cn":"开在废墟里的花店","intro":"一场拆迁过后，整条街只剩脚手架和灰墙。有人却在其中开了一家花店。","words":222,"paras":[{"t":"p","c":"When the demolition crew moved in, most shopkeepers left within a month. Boarded windows, empty frames, piles of bricks where bakeries and barbershops used to stand. The street became a gray corridor that people crossed quickly, eyes down."},{"t":"p","c":"Then, in the middle of the chaos, a small shop reopened. The owner, a woman in her forties named Xu, had run a bakery on the same corner for a decade. When the building came down, she did not move on. She rented the only intact unit left, swept out the dust, and opened a flower shop."},{"t":"p","c":"Her neighbors thought it was a joke. Who would buy flowers on a ruined street? But Xu hung a sign that read \"For the street that is still alive\" and placed buckets of sunflowers by the door. Slowly, people began to stop. Construction workers bought small bouquets for their wives. Nearby residents, returning home past the rubble, found themselves pausing at the one bright spot."},{"t":"p","c":"\"A city tears things down,\" Xu says, watering the roses. \"But a city is not made of buildings. It's made of people deciding not to leave. As long as one flower blooms here, the street is not dead yet.\""}],"vocab":[{"w":"demolition","pos":"n.","def":"拆除，拆迁"},{"w":"crew","pos":"n.","def":"队伍，工作组"},{"w":"boarded","pos":"adj.","def":"用木板封住的"},{"w":"corridor","pos":"n.","def":"走廊，通道"},{"w":"chaos","pos":"n.","def":"混乱"},{"w":"intact","pos":"adj.","def":"完好的，未受损的"},{"w":"bucket","pos":"n.","def":"水桶"},{"w":"bouquet","pos":"n.","def":"花束"},{"w":"rubble","pos":"n.","def":"碎石，瓦砾"},{"w":"bloom","pos":"v.","def":"开花，绽放"}]},{"id":"13","date":"2026-09-24","category":"story","len":"medium","title":"The Diary Found in a Cafe","cn":"咖啡馆里捡到的日记本","intro":"一本被遗忘的日记，让陌生人开始了一场温柔的接力。他们决定替主人把故事写完。","words":372,"paras":[{"t":"p","c":"It was a worn notebook with a blue cover, left on a table near the window of the small cafe on Nanluogu Alley. The staff kept it for a month, expecting the owner to return. When no one did, they opened it to look for contact information and found something else: a diary, written in neat handwriting, describing one ordinary day at a time."},{"t":"p","c":"The entries were simple and unremarkable. A visit to the market. A phone call with a mother who talked too long. A rainy afternoon spent watching the window. The writer never signed a name, only dated each page, and the last entry ended mid-sentence: \"Tomorrow I will tell you about the river.\" There was no tomorrow in the notebook."},{"t":"p","c":"The cafe manager did not return the diary to the drawer. Instead, she added a page of her own, telling the unknown writer that the notebook was safe and inviting anyone who read it to continue. Then she left the diary on the same table, with a small card: \"Please read, and if you like, write one page.\""},{"t":"p","c":"What happened next surprised everyone. Over the following months, the notebook filled with new handwriting. A nurse wrote about her night shift. A teenager wrote about failing an exam. A retired teacher wrote about the birds in the park. Strangers became contributors, then friends, then co-authors of a story none of them had planned."},{"t":"p","c":"When the notebook finally ran out of pages, someone bought a second one and left it in its place. The cafe now keeps a small shelf for what regulars call \"the shared diary.\" Some pages are long, some are only a line. All of them end the same way the first one did not: with the promise of a tomorrow."},{"t":"p","c":"\"We never found out who wrote the first page,\" the manager says. \"But I think that was the point. The diary wasn't lost. It was waiting to be passed on.\""}],"vocab":[{"w":"notebook","pos":"n.","def":"笔记本"},{"w":"entry","pos":"n.","def":"（日记的）条目，记录"},{"w":"unremarkable","pos":"adj.","def":"平凡的，不引人注目的"},{"w":"mid-sentence","pos":"n.","def":"句子中间"},{"w":"contributor","pos":"n.","def":"投稿者，贡献者"},{"w":"co-author","pos":"n.","def":"合著者"},{"w":"shelf","pos":"n.","def":"书架，架子"},{"w":"shared","pos":"adj.","def":"共享的，共同的"},{"w":"pass on","pos":"phr.","def":"传递，转交"}]},{"id":"14","date":"2026-09-22","category":"story","len":"short","title":"The Cat Who Owned the Street","cn":"拥有一整条街的猫","intro":"一只橘猫盘踞在街口的便利店前。五年里，它见证了整条街从陌生到熟悉的全部过程。","words":220,"paras":[{"t":"p","c":"The orange cat arrived on the street the same week the convenience store opened, and in the five years since, no one has managed to convince it that the sidewalk belongs to anyone else. It sleeps on the newspaper stand at noon, patrols the vegetable stall at dusk, and conducts a daily inspection of every shop entrance at precisely nine in the morning."},{"t":"p","c":"The shopkeepers call it \"the supervisor.\" The delivery riders know that packages left in its sun spot will be refused. The children of the neighborhood have learned that it accepts exactly one chin scratch per visitor, no more, no less."},{"t":"p","c":"Strangers who try to carry it home discover that the cat has no interest in being owned. It lives where it chooses, eats where it is fed, and returns every evening to the same cardboard box beside the fruit shop, as if checking that the street has not changed in its absence."},{"t":"p","c":"When a development plan threatened to widen the road, the shopkeepers formed an unusual alliance: they signed a petition to preserve the sidewalk, citing the cat as the street's oldest resident. The plan was revised. The cat, unaware of the paperwork, simply stretched, yawned, and resumed its patrol, one paw at a time."}],"vocab":[{"w":"convenience","pos":"n.","def":"便利（convenience store 便利店）"},{"w":"convince","pos":"v.","def":"说服，使相信"},{"w":"patrol","pos":"v.","def":"巡逻，巡查"},{"w":"inspection","pos":"n.","def":"检查，视察"},{"w":"precisely","pos":"adv.","def":"精确地，恰好"},{"w":"supervisor","pos":"n.","def":"监督者，主管"},{"w":"scratch","pos":"n.","def":"抓，挠"},{"w":"threaten","pos":"v.","def":"威胁"},{"w":"alliance","pos":"n.","def":"联盟，同盟"},{"w":"petition","pos":"n.","def":"请愿书"},{"w":"resume","pos":"v.","def":"恢复，重新开始"}]},{"id":"15","date":"2026-09-20","category":"story","len":"medium","title":"The Piano Tuner Who Heard Too Much","cn":"听得太多的钢琴调音师","intro":"四十年来，他靠耳朵分辨音准，也靠耳朵听见了无数家庭没有说出口的故事。","words":360,"paras":[{"t":"p","c":"Zhao Sheng has been tuning pianos for forty years, and he says the work is nine-tenths listening. The ear does not only hear the note that is slightly flat or sharp. It hears the room: whether it is quiet or noisy, whether the piano has been cared for or neglected, whether the family that owns it has time to sit down and play."},{"t":"p","c":"His first clients were schools and theaters, where the pianos were battle-scarred and out of tune from hard use. Then, as families began buying pianos for their children, his work moved into living rooms. He has tuned the same instrument in the same apartment for three generations now, watching the child at the bench grow up, leave, and return with children of her own."},{"t":"p","c":"\"A piano records a family's life,\" he says, tightening a string with careful precision. \"When the children were small, the keys were worn from daily practice. When they grew up and moved away, dust settled on the lid. When the old people passed on, the piano sat silent for months. You can hear all of it, if you listen to the silences as much as the notes.\""},{"t":"p","c":"His most difficult job was a piano that had not been opened for ten years, in a house where the family had lost a daughter. The mother asked him to tune it anyway, \"so that it sounds the way it did when she played.\" He worked slowly, and when he finished, he played one short, gentle piece, the kind a child might learn in her first year of lessons."},{"t":"p","c":"The mother did not speak. She simply sat on the bench, placed her hands on the keys, and played the same piece, from memory, without a single wrong note. Zhao packed his tools and left without saying goodbye. Some rooms, he tells younger tuners, are already in perfect tune; you just have to hear them."},{"t":"p","c":"He still works by ear, refusing the electronic tuners that younger colleagues use. \"Machines measure the pitch,\" he says. \"But they can't hear the story.\" At seventy-one, he plans to keep tuning as long as his hearing holds. \"The day I can't tell a flat note from a sharp one,\" he laughs, \"I'll retire. But a piano that is out of tune is a person waiting to speak. I can't leave that.\""}],"vocab":[{"w":"tune","pos":"v.","def":"调音，调谐"},{"w":"flat","pos":"adj.","def":"（音）偏低的"},{"w":"sharp","pos":"adj.","def":"（音）偏高的"},{"w":"neglected","pos":"adj.","def":"被忽视的，疏于照料的"},{"w":"battle-scarred","pos":"adj.","def":"伤痕累累的"},{"w":"precision","pos":"n.","def":"精确，精密"},{"w":"lid","pos":"n.","def":"盖子，琴盖"},{"w":"settle","pos":"v.","def":"沉积，落下"},{"w":"gentle","pos":"adj.","def":"轻柔的，温和的"},{"w":"pitch","pos":"n.","def":"音高"}]},{"id":"16","date":"2026-09-18","category":"essay","len":"long","title":"Why We Are Losing the Ability to Concentrate","cn":"我们为什么正在失去专注的能力","intro":"注意力不是意志力问题，而是环境问题。当手机成为我们身体的一部分，专注成了一种需要练习的技能。","words":452,"paras":[{"t":"p","c":"A friend of mine recently tried to read a book on the train. He opened it, read two paragraphs, and instinctively reached for his phone. He caught himself, put the phone down, and read two more paragraphs. Then he picked up the phone again, checked a message, and could not remember what he had just read. \"I feel like my brain has been rewired,\" he said. \"Not for the better.\""},{"t":"p","c":"He is not alone. Across age groups, studies report the same complaint: reading feels harder, thinking feels shallower, and the mind jumps from task to task like a nervous bird. Psychologists have a name for this pattern, but the experience needs no research: most of us know exactly what it feels like to sit down with an important task and lose the thread within minutes."},{"t":"p","c":"The common explanation is that we lack willpower. The deeper explanation is that we are fighting an environment designed to win. Every notification, every infinite scroll, every autoplaying video is engineered to capture attention for a few seconds longer. We blame ourselves for being distracted, but we are, in a real sense, outmatched."},{"t":"p","c":"The good news is that concentration behaves like a muscle: it grows with use and shrinks with neglect. Researchers who study deep work consistently find that people who protect their attention, by setting aside blocks of time with the phone in another room, recover their ability to focus within weeks, not years."},{"t":"p","c":"The practical steps are unglamorous. One task at a time. Notifications off during working hours. A book on the nightstand instead of a charging phone. A walk without headphones. These sound too simple to matter, which is exactly why we dismiss them and continue to suffer."},{"t":"p","c":"But there is something more important than technique. We should stop treating distraction as a personal failure. The attention economy is a real industry with real engineers, and pretending otherwise only adds shame to exhaustion. Reclaiming focus is not a competition against our own weakness; it is a decision about what kind of life we want: a life of fragments, or a life of whole moments."},{"t":"p","c":"The book on the train is a good place to start. Two paragraphs, then two more, then a page. The phone will always be there. The question is whether we will still be capable of choosing something else."}],"vocab":[{"w":"instinctively","pos":"adv.","def":"本能地"},{"w":"rewired","pos":"adj.","def":"重新连接的，重塑的"},{"w":"complaint","pos":"n.","def":"抱怨，投诉"},{"w":"shallow","pos":"adj.","def":"浅的，肤浅的"},{"w":"willpower","pos":"n.","def":"意志力"},{"w":"engineered","pos":"adj.","def":"被设计的，被精心安排的"},{"w":"outmatched","pos":"adj.","def":"处于劣势的，被压制的"},{"w":"consistently","pos":"adv.","def":"一贯地，持续地"},{"w":"nightstand","pos":"n.","def":"床头柜"},{"w":"dismiss","pos":"v.","def":"不理会，驳回"},{"w":"exhaustion","pos":"n.","def":"精疲力竭"},{"w":"reclaim","pos":"v.","def":"收回，重新获得"},{"w":"fragment","pos":"n.","def":"碎片，片段"}]},{"id":"17","date":"2026-09-16","category":"essay","len":"medium","title":"The Skill of Slowing Down","cn":"慢下来的能力","intro":"我们学会了很多技能，却没有学会在需要的时候慢下来。慢，不是懒惰，而是一种清醒。","words":348,"paras":[{"t":"p","c":"There is a small exercise used in some mindfulness classes: eat a single raisin as slowly as possible. Look at it first. Feel its texture. Place it on the tongue and let it sit before biting. Most people are surprised to discover that a raisin, eaten this way, is almost a meal. The exercise is not about raisins. It is about the discovery that speed erases experience."},{"t":"p","c":"We are trained for speed everywhere. Fast food, fast reading, fast replies, fast results. Efficiency has become a virtue so total that slowness feels like a failure, a personal defect to be fixed. Yet the things we most value, friendship, memory, understanding, love, cannot be produced quickly. They are slow by nature, and no optimization will change that."},{"t":"p","c":"Slowing down is not the same as doing less. It is doing the same things with more of yourself present. A slow walk is not slower transportation; it is a different activity. A slow conversation is not an inefficient meeting; it is a different kind of exchange, one in which people actually finish their thoughts."},{"t":"p","c":"The difficulty is that slowness cannot be scheduled like a meeting. You cannot squeeze it between tasks. It requires, at least occasionally, an empty hour, a stretch of time with nothing assigned to it. The mind needs these gaps the way soil needs fallow seasons; without them, it grows thin and crowded with weeds."},{"t":"p","c":"Perhaps the most practical advice comes from farmers: do not fill every field. Leave one empty, and it will restore the others. The same logic applies to attention. Guard a patch of slowness each day, no matter how small, and you will find that the fast hours work better, and taste better too."}],"vocab":[{"w":"raisin","pos":"n.","def":"葡萄干"},{"w":"texture","pos":"n.","def":"质地，口感"},{"w":"erase","pos":"v.","def":"抹去，消除"},{"w":"efficiency","pos":"n.","def":"效率"},{"w":"virtue","pos":"n.","def":"美德，优点"},{"w":"defect","pos":"n.","def":"缺陷，毛病"},{"w":"optimization","pos":"n.","def":"优化"},{"w":"fallow","pos":"adj.","def":"休耕的，闲置的"},{"w":"weed","pos":"n.","def":"杂草"},{"w":"restore","pos":"v.","def":"恢复，修复"},{"w":"guard","pos":"v.","def":"守护，保护"}]},{"id":"18","date":"2026-09-14","category":"essay","len":"short","title":"On Being Alone in a Crowded City","cn":"在拥挤的城市里独自生活","intro":"城市从不缺少人，却常常缺少陪伴。独居不是一种失败，而是一种需要学习的相处方式。","words":216,"paras":[{"t":"p","c":"It is possible to live for years in a large city and never spend a night truly alone. The neighbors are near, the streets are full, the cafes are open until late. And it is equally possible to live in that same city, surrounded by millions, and feel a loneliness that has nothing to do with the number of people around you."},{"t":"p","c":"Loneliness is often treated as a problem to be solved, as if the only cure were more company. But the experience of living alone, and living alone well, is a skill with its own rewards. People who learn it develop a quieter confidence: they know how to keep their own company, how to cook for one, how to spend an evening without asking permission from anyone."},{"t":"p","c":"The city helps, if you know where to look. The morning market where the vegetable seller remembers your usual order. The library desk by the window that is always free at eight. The noodle shop where the owner knows you take your soup without chili. These small recognitions are not the same as friendship, but they are real, and they add up."},{"t":"p","c":"Being alone in a crowd is not a contradiction. It is a practice. And like most practices, it gets easier, and richer, the longer you keep at it."}],"vocab":[{"w":"crowded","pos":"adj.","def":"拥挤的"},{"w":"surrounded","pos":"adj.","def":"被包围的"},{"w":"loneliness","pos":"n.","def":"孤独，寂寞"},{"w":"cure","pos":"n.","def":"疗法，解决办法"},{"w":"company","pos":"n.","def":"陪伴"},{"w":"confidence","pos":"n.","def":"自信"},{"w":"recognition","pos":"n.","def":"认出，认可"},{"w":"noodle","pos":"n.","def":"面条"},{"w":"contradiction","pos":"n.","def":"矛盾，悖论"},{"w":"practice","pos":"n.","def":"练习，实践"}]},{"id":"19","date":"2026-09-12","category":"soul","len":"medium","title":"A Letter to the Me of Ten Years Ago","cn":"给十年前的自己写一封信","intro":"如果有一封信可以寄给过去的自己，你想说些什么？也许不必后悔，只是把现在的温柔，提前送达。","words":344,"paras":[{"t":"p","c":"Dear younger me: I am writing this from a future you once worried about. The exam results arrived, as they always do, and some of them disappointed you, exactly as you feared. The relationship that ended, ended. The job you were not sure you wanted, you left. You were right about all of it, and you were also wrong, because none of those endings turned out to be the story. They were only the early chapters."},{"t":"p","c":"I know you are trying so hard to get everything right. You compare yourself with everyone, measure yourself against every standard, and keep a running list of your failures. I wish I could tell you to stop, but you would not listen, and that is fine. You will learn it the way everyone learns it: slowly, through experience, through the nights when the list of failures seemed longer than the list of days."},{"t":"p","c":"What I really want to tell you is softer. The people you think are judging you are mostly not thinking about you at all; they are worrying about themselves, the same way you are. The friend you lost, you will understand later why it happened, and it will stop hurting. The dream you are about to give up on, you will not give up on it; you will only pause, and the pause will lead you somewhere unexpected."},{"t":"p","c":"Please eat well and sleep more. Please take the photo. Please say yes to the strange invitation, and also say no when you need to. Please stop apologizing for taking up space."},{"t":"p","c":"Most of all, please know this: you are not behind. There is no race, there never was. The life you are building is being built at exactly the right speed, the speed that allows you to actually live it. I cannot tell you everything, because some of the best parts would lose their surprise. But I can tell you this much, and you will understand it soon: it gets better, not because the world changes, but because you learn to carry it differently."},{"t":"p","c":"With love, the you who made it here."}],"vocab":[{"w":"disappoint","pos":"v.","def":"使失望"},{"w":"chapter","pos":"n.","def":"章节，篇章"},{"w":"compare","pos":"v.","def":"比较"},{"w":"measure","pos":"v.","def":"衡量，测量"},{"w":"standard","pos":"n.","def":"标准"},{"w":"judging","pos":"v.","def":"评判，评价"},{"w":"apologize","pos":"v.","def":"道歉"},{"w":"invitation","pos":"n.","def":"邀请"},{"w":"surprise","pos":"n.","def":"惊喜，意外"},{"w":"carry","pos":"v.","def":"承受，携带"}]},{"id":"20","date":"2026-09-10","category":"soul","len":"short","title":"The Small, Certain Joys","cn":"微小而确定的快乐","intro":"快乐不总是轰轰烈烈。它常常藏在刚晒好的被子里、热汤的第一口里、以及傍晚六点的天空里。","words":204,"paras":[{"t":"p","c":"There is a kind of joy that does not announce itself. It arrives quietly, without ceremony, and it is easy to miss if you are busy waiting for something bigger. Psychologists sometimes call these moments of small pleasure; the writer Virginia Woolf called them \"moments of being,\" when the day suddenly feels completely present."},{"t":"p","c":"The pillowcase dried in the sun, smelling of warmth. The first spoonful of soup when you are hungrier than you realized. The exact moment when the sky outside the window turns that particular shade of blue at six in the evening. The bus arriving just as you reach the stop. The cat choosing your lap."},{"t":"p","c":"None of these are achievements. They cannot be added to a resume or posted for approval. That is precisely their value: they ask for nothing and give without condition. They are the small interest payments on the ordinary day, paid in full, every day, to anyone who bothers to notice."},{"t":"p","c":"The trick is not to collect more of them but to slow down enough to receive the ones already there. Notice the warmth of the cup before you drink. Notice the sound of rain before you worry about the walk home. The day is full of small, certain joys, and they were never the ones making noise."}],"vocab":[{"w":"announce","pos":"v.","def":"宣布，宣告"},{"w":"ceremony","pos":"n.","def":"仪式"},{"w":"pillowcase","pos":"n.","def":"枕套"},{"w":"spoonful","pos":"n.","def":"一勺之量"},{"w":"shade","pos":"n.","def":"色调，色度"},{"w":"achievement","pos":"n.","def":"成就，成绩"},{"w":"approval","pos":"n.","def":"认可，批准"},{"w":"interest","pos":"n.","def":"利息，兴趣"},{"w":"payment","pos":"n.","def":"付款，回报"},{"w":"receive","pos":"v.","def":"接受，收到"}]},{"id":"21","date":"2026-09-08","category":"essay","len":"medium","title":"Memory Is a Book We Keep Rewriting","cn":"记忆是一本不断重写的书","intro":"我们以为记忆是录像带，其实它是画笔。每次回忆，我们都在悄悄修改过去。","words":342,"paras":[{"t":"p","c":"A curious thing happens when old friends meet and talk about the past. Each person tells the same story slightly differently. What was a joyful day for one was a difficult one for another. The disagreement is not a failure of memory; it is the nature of memory. We do not store our past like files on a disk. We rebuild it, every time we remember."},{"t":"p","c":"Neuroscientists describe this as reconsolidation: each time a memory is retrieved, it is briefly fragile, and then stored again, with whatever has changed since. The memory is never quite the version that was stored before. This is why a place you revisit after many years feels both familiar and different: part of the difference is in the place, and part is in you, and the two can no longer be separated."},{"t":"p","c":"There is something humbling, and something freeing, in this idea. Humbling, because we cannot claim to be perfectly faithful witnesses to our own lives. Freeing, because it means we are not prisoners of a fixed past. The version of events we carry can be revised, gently, with time and understanding. Forgiveness, in this light, is partly a work of memory: the ability to re-tell the old story with a kinder ending."},{"t":"p","c":"Families, too, are collective editors. A shared memory is told and retold until it becomes a family story, polished by each telling, kept alive by repetition. The photograph albums are only the visible layer; beneath them lie thousands of tellings, each one a small act of preservation and a small act of change."},{"t":"p","c":"Perhaps the healthiest attitude is to hold our memories with both conviction and humility: trust that what we remember mattered, and accept that we cannot remember it exactly. The book of a life is never finished. It is being rewritten, page by page, every time we look back."}],"vocab":[{"w":"curious","pos":"adj.","def":"奇怪的，好奇的"},{"w":"slightly","pos":"adv.","def":"稍微，略微"},{"w":"disagreement","pos":"n.","def":"分歧，不一致"},{"w":"reconsolidation","pos":"n.","def":"再巩固，重新整合"},{"w":"retrieve","pos":"v.","def":"检索，取回"},{"w":"fragile","pos":"adj.","def":"脆弱的，易碎的"},{"w":"revisit","pos":"v.","def":"重访，故地重游"},{"w":"humbling","pos":"adj.","def":"令人谦卑的"},{"w":"faithful","pos":"adj.","def":"忠实的，如实的"},{"w":"witness","pos":"n.","def":"见证人，目击者"},{"w":"forgiveness","pos":"n.","def":"宽恕，原谅"},{"w":"collective","pos":"adj.","def":"集体的"},{"w":"conviction","pos":"n.","def":"信念，确信"}]},{"id":"22","date":"2026-09-06","category":"essay","len":"medium","title":"The New Loneliness of the Connected Age","cn":"互联时代的\"新孤独\"","intro":"我们的通讯录里有几千人，却常常找不到一个可以深夜打电话的人。连接不等于陪伴。","words":338,"paras":[{"t":"p","c":"The average phone contains thousands of contacts, dozens of apps designed to connect us, and the ability to reach almost anyone on earth within seconds. And yet, when researchers ask people how many close friends they have, the numbers have been falling for years. We have never been more connected, and never more conscious of being alone."},{"t":"p","c":"Part of the explanation is that connection and companionship are different things. A message takes seconds to send and seconds to answer, but it carries almost no weight. It does not require the risk of vulnerability, the patience of listening, or the presence of a body in the same room. These are the raw materials of friendship, and they cannot be compressed into a text."},{"t":"p","c":"There is also a quieter cost. When we can always reach someone, we rarely miss anyone, and missing is part of how affection deepens. The anticipation of a letter, the waiting for a train, the long distance that made a visit an event: these old inconveniences built a kind of emotional architecture that instant contact does not."},{"t":"p","c":"None of this is an argument against technology, which has also kept families together across oceans and brought friends back from silence. The argument is about attention. We have learned to stay in touch. The harder skill is staying near, with the full weight of an evening, a meal, or a walk shared without a screen in hand."},{"t":"p","c":"The phone will not solve the new loneliness, because the phone is where part of it was born. But the remedy is close at hand, in the oldest technology we have: two people, a table, and time that no notification is allowed to interrupt."}],"vocab":[{"w":"contact","pos":"n.","def":"联系人，接触"},{"w":"conscious","pos":"adj.","def":"意识到的，清醒的"},{"w":"companionship","pos":"n.","def":"陪伴，友谊"},{"w":"vulnerability","pos":"n.","def":"脆弱，易受伤害"},{"w":"raw","pos":"adj.","def":"原始的，未加工的"},{"w":"compress","pos":"v.","def":"压缩"},{"w":"anticipation","pos":"n.","def":"期待，预期"},{"w":"inconvenience","pos":"n.","def":"不便，麻烦"},{"w":"architecture","pos":"n.","def":"结构，架构"},{"w":"remedy","pos":"n.","def":"补救办法，疗法"},{"w":"interrupt","pos":"v.","def":"打断，中断"}]},{"id":"23","date":"2026-09-04","category":"essay","len":"short","title":"On Reading in an Age of Information Overload","cn":"信息过载时代的阅读","intro":"我们每天接收的信息比祖先一辈子还多，却越来越不会阅读了。读得浅，是因为我们允许自己读得浅。","words":222,"paras":[{"t":"p","c":"Information is no longer scarce. The modern problem is the opposite: there is too much of it, arriving too fast, demanding attention that is already exhausted. We skim, we swipe, we open forty articles a day and finish none of them. And then we wonder why the world feels blurry."},{"t":"p","c":"Reading, real reading, is not the same as consuming information. It is a slow process in which the reader and the text work on each other. A sentence is read, resisted, returned to. An idea meets the reader's own experience and is tested there. This cannot happen in sixty seconds, which is why the reading we actually do in a day, the deep kind, is measured in pages, not in feeds."},{"t":"p","c":"The strange truth is that we still have the same number of hours as our grandparents. What has changed is how many of them we spend waiting to be entertained. Every notification is a small interruption, and each interruption is a small theft from the only resource that matters: attention."},{"t":"p","c":"To read well again, start small. One book at a time. One page a day if that is all you have. The feed will still be there when you look up. It always is. The question is whether you will still be able to look down."}],"vocab":[{"w":"scarce","pos":"adj.","def":"稀缺的，不足的"},{"w":"exhausted","pos":"adj.","def":"精疲力竭的"},{"w":"skim","pos":"v.","def":"略读，浏览"},{"w":"blurry","pos":"adj.","def":"模糊的"},{"w":"resist","pos":"v.","def":"抵抗，抗拒"},{"w":"entertained","pos":"adj.","def":"被娱乐的"},{"w":"interruption","pos":"n.","def":"打断，中断"},{"w":"theft","pos":"n.","def":"偷窃"},{"w":"feed","pos":"n.","def":"信息流，订阅源"}]},{"id":"24","date":"2026-09-02","category":"essay","len":"medium","title":"Why We Are Afraid of Empty Time","cn":"为什么我们害怕空白的时间","intro":"等人的五分钟、没有安排的一个下午，为什么让我们焦虑？空白不是浪费，它恰恰是想法生长的地方。","words":336,"paras":[{"t":"p","c":"Watch what happens when a person is left with thirty seconds of nothing. The hand reaches for the phone, almost automatically, as if the empty moment were a small emergency. We fill waiting rooms with scrolling, fill bus stops with headphones, fill the gap between meetings with a quick check of everything and nothing. The horror of empty time has become one of the defining anxieties of the age."},{"t":"p","c":"The fear is understandable. Empty time is where boredom lives, and boredom is uncomfortable. It presses against us with questions we would rather not ask: Is this what I really want to be doing? Am I in the right place? What am I missing right now? The phone offers a merciful escape from these questions, which is precisely why it is so hard to put down."},{"t":"p","c":"But the escape has a cost. Creativity does not arrive during busyness; it arri
