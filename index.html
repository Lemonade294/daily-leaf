<script>
/* ============================================================
   应用逻辑
   ============================================================ */
"use strict";
(function(){
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  /* ---------- 主题 ---------- */
  const STORE_KEY = 'dailyLeafStore';
  const store = loadStore();
  function loadStore(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){ const d = JSON.parse(raw); if(d && typeof d === 'object') return d; }
    }catch(e){}
    return { theme:null, readArticles:{}, readDays:{}, wordbook:[], fontSize:0 };
  }
  function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    const sun = $('#themeIconSun'), moon = $('#themeIconMoon');
    sun.style.display = t === 'midnight' ? '' : 'none';
    moon.style.display = t === 'midnight' ? 'none' : '';
  }
  function initTheme(){
    let t = store.theme;
    if(!t){
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'midnight' : 'paper';
    }
    applyTheme(t);
  }
  $('#themeBtn').addEventListener('click', function(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'midnight' ? 'paper' : 'midnight';
    store.theme = next; saveStore(); applyTheme(next);
  });

  /* ---------- 工具 ---------- */
  const CATS = { news:'新闻', story:'故事', essay:'评论', soul:'治愈' };
  const CAT_COLORS = {
    news:'#3E7C6F', story:'#4A6FA5', essay:'#8A6A3F', soul:'#9C5F4D'
  };
  const LENS = { short:'短篇', medium:'中篇', long:'长篇' };
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function cnDate(d){
    const weeks = ['日','一','二','三','四','五','六'];
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 星期' + weeks[d.getDay()];
  }
  /* 生效日期：Actions 烧录的发布日优先（3 天内），否则用浏览器当天 */
  function effectiveToday(){
    var ov = (typeof TODAY_OVERRIDE !== 'undefined' && TODAY_OVERRIDE) ? TODAY_OVERRIDE : '';
    var now = new Date(); now.setHours(0,0,0,0);
    if(ov){
      var p = ov.split('-').map(Number);
      if(p.length === 3 && p.every(function(x){ return !isNaN(x); })){
        var ovDate = new Date(p[0], p[1]-1, p[2]);
        var diff = Math.round((now - ovDate) / 86400000);
        if(diff >= 0 && diff <= 3) return ovDate;
      }
    }
    return now;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  /* 以日期为种子，从文章池确定性选出 20 篇（每日自动更新） */
  function todayIds(d){
    const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
    const seed = y*10000 + m*100 + day;
    const rnd = mulberry32(seed);
    const pool = ARTICLES.map(a => a.id);
    // Fisher-Yates 打乱，取前20
    for(let i = pool.length-1; i > 0; i--){
      const j = Math.floor(rnd() * (i+1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, 20);
  }

  /* ---------- 状态 ---------- */
  const state = {
    todayIds: null,
    cat: 'all',
    len: 'all',
    query: '',
    currentArticle: null
  };

  /* ---------- 顶栏导航 ---------- */
  const NAV_ITEMS = [ ['all','全部'], ['news','新闻'], ['story','故事'], ['essay','评论'], ['soul','治愈'] ];
  function renderNav(){
    $('#mainNav').innerHTML = NAV_ITEMS.map(([k,label]) =>
      `<button class="nav-btn ${state.cat===k?'active':''}" data-cat="${k}">${label}</button>`).join('');
  }
  $('#mainNav').addEventListener('click', e => {
    const b = e.target.closest('.nav-btn'); if(!b) return;
    state.cat = b.dataset.cat; state.query = ''; $('#searchInput').value=''; $('#searchClear').classList.remove('show');
    renderNav(); renderPills(); renderGrid(); updateHint();
  });

  /* ---------- 筛选 ---------- */
  function renderPills(){
    const catCount = c => c==='all' ? ARTICLES.length : ARTICLES.filter(a=>a.category===c).length;
    const lenCount = l => l==='all' ? ARTICLES.length : ARTICLES.filter(a=>a.len===l).length;
    $('#catPills').innerHTML = NAV_ITEMS.map(([k,label]) =>
      `<button class="pill ${state.cat===k?'active':''}" data-cat="${k}">${label}<span class="cnt">${catCount(k)}</span></button>`).join('');
    $('#lenPills').innerHTML = [['all','不限'],['short','短篇'],['medium','中篇'],['long','长篇']].map(([k,label]) =>
      `<button class="pill ${state.len===k?'active':''}" data-len="${k}">${label}<span class="cnt">${lenCount(k)}</span></button>`).join('');
  }
  $('#catPills').addEventListener('click', e => {
    const b = e.target.closest('.pill'); if(!b) return;
    state.cat = b.dataset.cat; renderNav(); renderPills(); renderGrid(); updateHint();
  });
  $('#lenPills').addEventListener('click', e => {
    const b = e.target.closest('.pill'); if(!b) return;
    state.len = b.dataset.len; renderPills(); renderGrid(); updateHint();
  });
  function updateHint(){
    const n = filtered().length;
    $('#filterHint').textContent = n ? `共 ${n} 篇` : '';
  }

  /* ---------- 搜索 ---------- */
  const searchInput = $('#searchInput');
  searchInput.addEventListener('input', function(){
    state.query = this.value.trim().toLowerCase();
    $('#searchClear').classList.toggle('show', !!state.query);
    if(state.query){
      // 从任意页回到首页搜索结果
      if(!$('#view-home').classList.contains('active')) go('#/home');
    }
    renderGrid(); updateHint();
  });
  $('#searchClear').addEventListener('click', function(){
    searchInput.value=''; state.query=''; this.classList.remove('show'); renderGrid(); updateHint();
  });

  /* ---------- 卡片墙 ---------- */
  function filtered(){
    let list = ARTICLES.filter(a => {
      if(state.cat !== 'all' && a.category !== state.cat) return false;
      if(state.len !== 'all' && a.len !== state.len) return false;
      return true;
    });
    if(state.query){
      list = list.filter(a => {
        const hay = (a.title + ' ' + a.cn + ' ' + a.intro + ' ' + a.paras.join(' ') + ' ' +
          (a.vocab||[]).map(v=>v.w).join(' ')).toLowerCase();
        return hay.indexOf(state.query) !== -1;
      });
    }
    return list;
  }
  const COVER_THEMES = [
    ['#3E7C6F','#2C5E54'], ['#4A6FA5','#3A5A85'], ['#8A6A3F','#6E5230'],
    ['#7A5C8C','#5E4770'], ['#9C5F4D','#7C4A3C'], ['#5E7A5A','#476046']
  ];
  function coverTheme(id){
    let h = 0; for(const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    const t = COVER_THEMES[h % COVER_THEMES.length];
    const isNight = document.documentElement.getAttribute('data-theme') === 'midnight';
    return isNight ? t : t;
  }
  function renderGrid(){
    const wrap = $('#cardGrid');
    const list = filtered();
    if(!list.length){
      wrap.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 4c-1.8-1.7-4.1-2.3-7-2v15c2.9-.3 5.2.3 7 2 1.8-1.7 4.1-2.3 7-2V2c-2.9-.3-5.2.3-7 2z"/><path d="M12 4v15"/></svg>
        <p>没有找到匹配的文章</p>
        <p class="sub">换个关键词或筛选条件试试</p></div>`;
      return;
    }
    const today = new Set(state.todayIds);
    wrap.innerHTML = list.map(a => {
      const t = COVER_THEMES[Math.abs(hashId(a.id)) % COVER_THEMES.length];
      const isRead = store.readArticles[a.id];
      return `
      <article class="book-card" data-id="${a.id}" tabindex="0" role="button" aria-label="阅读 ${esc(a.title)}">
        <div class="book-cover" style="background:linear-gradient(150deg, ${t[0]}, ${t[1]})">
          ${today.has(a.id) ? '<span class="book-new">今日</span>' : ''}
          <div class="cover-meta">
            <span class="cover-cat">${CATS[a.category]}</span>
            <span class="cover-len">${LENS[a.len]}</span>
          </div>
          <div class="cover-num">${String(a.id).padStart(2,'0')}</div>
          <div class="cover-title">${esc(a.title)}<span class="cn">${esc(a.cn)}</span></div>
        </div>
        <div class="book-body">
          <p class="book-intro">${esc(a.intro)}</p>
          <div class="book-foot">
            <span class="book-words">${a.words ? a.words + ' 词' : '· ' + (a.vocab||[]).length + ' 生词'}</span>
            ${isRead ? '<span class="book-flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>已读</span>' : ''}
            <span class="book-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </div>
        </div>
      </article>`;
    }).join('');
  }
  function hashId(id){
    let h = 0; const s = String(id);
    for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
    return h;
  }
  $('#cardGrid').addEventListener('click', e => {
    const card = e.target.closest('.book-card'); if(!card) return;
    go('#/article/' + card.dataset.id);
  });
  $('#cardGrid').addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.classList.contains('book-card')){
      go('#/article/' + e.target.dataset.id);
    }
  });

  /* ---------- 阅读页 ---------- */
  function renderArticle(id){
    const a = ARTICLES.find(x => x.id === id);
    if(!a){ go('#/home'); return; }
    state.currentArticle = a;
    if(!store.readArticles[id]){
      store.readArticles[id] = true;
      const today = dateKey(new Date());
      store.readDays[today] = true;
      saveStore();
    }
    const t = COVER_THEMES[Math.abs(hashId(id)) % COVER_THEMES.length];
    $('#articleWrap').innerHTML = `
      <div class="article-head">
        <div class="art-meta">
          <span class="art-cat" style="background:${CAT_COLORS[a.category]}">${CATS[a.category]}</span>
          <span class="art-len">${LENS[a.len]} · ${a.words} 词</span>
          <span class="art-dot"></span>
          <span class="art-date">${a.date}</span>
        </div>
        <h1 class="art-title">${esc(a.title)}</h1>
        <p class="art-title-cn">${esc(a.cn)}</p>
        ${a.intro ? `<div class="art-lead"><span class="lead-tag">导 读</span>${esc(a.intro)}</div>` : ''}
      </div>
      <div class="read-toolbar">
        <span class="rt-label">字号</span>
        <button class="rt-btn" id="fsMinus" aria-label="减小字号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <span class="rt-size" id="fsLabel">${18.5 + (store.fontSize||0)}px</span>
        <button class="rt-btn" id="fsPlus" aria-label="增大字号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="rt-spacer"></span>
        <button class="rt-done ${store.readArticles[id]?'on':''}" id="rtDone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>已读</span>
        </button>
        <button class="rt-addword" id="rtAddWord">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>收藏本文生词</span>
        </button>
      </div>
      <div class="article-body" id="articleBody">${bodyHtml(a)}</div>
      <div class="art-foot">
        <button class="back-btn" id="backHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>返回列表</button>
        <div class="vocab-list-mini" style="display:none"></div>
      </div>
      <div class="art-vocab">
        <div class="vocab-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M8 8h6M8 12h5"/></svg>本篇重点词汇 · 点击查看释义</div>
        <div class="vocab-list">
          ${(a.vocab||[]).map(v => `
            <div class="vocab-item" data-w="${esc(v.w)}">
              <span class="vw">${esc(v.w)}</span>
              <span class="vp">${esc(v.pos||'')}</span>
              <span class="vd">${esc(v.def)}</span>
            </div>`).join('')}
        </div>
      </div>`;
    applyFontSize();
    bindArticle(a);
    requestAnimationFrame(updateProgress);
  }
  function bodyHtml(a){
    return a.paras.map(p => {
      if(p.t === 'h') return `<p class="art-subtitle">${esc(p.c)}</p>`;
      return `<p>${esc(p.c)}</p>`;
    }).join('');
  }
  function bindArticle(a){
    $('#backHome').addEventListener('click', () => go('#/home'));
    $('#rtDone').addEventListener('click', function(){
      const now = store.readArticles[a.id];
      if(now){ delete store.readArticles[a.id]; this.classList.remove('on'); toast('已取消已读标记'); }
      else{
        store.readArticles[a.id] = true;
        store.readDays[dateKey(new Date())] = true;
        this.classList.add('on'); toast('标记为已读 · 今日打卡 +1');
      }
      saveStore();
    });
    $('#fsMinus').addEventListener('click', () => { store.fontSize = Math.max(-4, (store.fontSize||0) - 1); saveStore(); applyFontSize(); });
    $('#fsPlus').addEventListener('click', () => { store.fontSize = Math.min(6, (store.fontSize||0) + 1); saveStore(); applyFontSize(); });
    $('#rtAddWord').addEventListener('click', () => {
      let n = 0;
      (a.vocab||[]).forEach(v => {
        if(!store.wordbook.some(w => w.w.toLowerCase() === v.w.toLowerCase())){
          store.wordbook.unshift({ w:v.w, pos:v.pos||'', def:v.def, from:a.cn, date:new Date().toISOString().slice(0,10), learned:false });
          n++;
        }
      });
      saveStore(); updateBadge();
      toast(n ? `已收藏 ${n} 个生词` : '本篇生词已全部收藏');
    });
    $('#articleBody').addEventListener('click', e => onBodyClick(e));
    $('#articleBody').addEventListener('touchend', e => onBodyClick(e), {passive:false});
    $$('#articleWrap .vocab-item').forEach(el => {
      el.addEventListener('click', () => showDict(el.dataset.w, a));
    });
    window.addEventListener('scroll', updateProgress, {passive:true});
  }
  function applyFontSize(){
    const fs = 18.5 + (store.fontSize||0);
    document.documentElement.style.setProperty('--fs-body', fs + 'px');
    document.documentElement.style.setProperty('--lh-body', (1.95 + (store.fontSize||0)*0.025).toFixed(3));
    const label = $('#fsLabel'); if(label) label.textContent = fs + 'px';
  }

  /* ---------- 点词查义 ---------- */
  function onBodyClick(e){
    const body = $('#articleBody');
    if(!body) return;
    const range = getRangeAt(e);
    if(!range) return;
    const node = range.startContainer;
    if(node.nodeType !== Node.TEXT_NODE) return;
    if(!body.contains(node)) return;
    const text = node.textContent;
    let off = range.startOffset;
    // 向左向右扩展取整词
    let s = off, t = off;
    while(s > 0 && /[A-Za-z']/.test(text[s-1])) s--;
    while(t < text.length && /[A-Za-z']/.test(text[t])) t++;
    if(s === t){ hideDict(); return; }
    const word = text.slice(s, t).replace(/^'+|'+$/g, '');
    if(!word || word.length < 2){ hideDict(); return; }
    showDict(word, state.currentArticle, {x:e.clientX, y:e.clientY});
    e.preventDefault();
  }
  function getRangeAt(e){
    try{
      if(e.clientX !== undefined && document.caretRangeFromPoint){
        return document.caretRangeFromPoint(e.clientX, e.clientY);
      }
      const sel = window.getSelection();
      if(sel && sel.rangeCount) return sel.getRangeAt(0);
    }catch(err){}
    return null;
  }
  const WORD_ANNOT = new WeakMap(); // 存已包裹词的引用（备用）

  /* ---------- 词典 ---------- */
  const DICT = Object.assign({}, COMMON_DICT || {});
  (ARTICLES||[]).forEach(a => {
    (a.vocab||[]).forEach(v => {
      const key = v.w.toLowerCase();
      if(!DICT[key]) DICT[key] = { w:v.w, pos:v.pos||'', def:v.def };
    });
  });
  let dictArticle = null;
  function lookupWord(w){
    const key = w.toLowerCase();
    const hit = DICT[key];
    if(hit) return { w:hit.w, pos:hit.pos, def:hit.def, source: dictArticle ? dictArticle.cn : '' };
    return { w, pos:'', def:'', source:'未收录' };
  }
  function showDict(w, art, point){
    dictArticle = art || null;
    const res = lookupWord(w);
    $('#dictWord').textContent = res.w;
    $('#dictPos').textContent = res.pos ? res.pos : '';
    $('#dictPhon').textContent = '';
    $('#dictDef').textContent = res.def || '词典暂未收录这个词，你可以将它加入生词本，方便之后复习。';
    $('#dictSource').textContent = res.source === '未收录'
      ? '当前词库未收录'
      : (res.source ? '出自：《' + res.source + '》' : '');
    const addBtn = $('#dictAdd');
    const already = store.wordbook.some(x => x.w.toLowerCase() === res.w.toLowerCase());
    addBtn.classList.toggle('done', already);
    addBtn.querySelector('span').textContent = already ? '已在生词本' : '加入生词本';
    addBtn.dataset.w = res.w; addBtn.dataset.pos = res.pos; addBtn.dataset.def = res.def;
    $('#dictBar').classList.add('show');
  }
  function hideDict(){ $('#dictBar').classList.remove('show'); }
  $('#dictAdd').addEventListener('click', function(){
    const w = this.dataset.w; if(!w) return;
    const exists = store.wordbook.some(x => x.w.toLowerCase() === w.toLowerCase());
    if(exists){ hideDict(); toast('这个词已在生词本中'); return; }
    store.wordbook.unshift({
      w, pos:this.dataset.pos||'', def:this.dataset.def||'',
      from: dictArticle ? dictArticle.cn : '', date:new Date().toISOString().slice(0,10), learned:false
    });
    saveStore(); updateBadge();
    this.classList.add('done'); this.querySelector('span').textContent = '已在生词本';
    toast('已加入生词本');
  });
  $('#dictClose').addEventListener('click', e => { hideDict(); e.stopPropagation(); });
  // 点击任意位置关闭：文档级捕获
  document.addEventListener('click', e => {
    const bar = $('#dictBar');
    if(!bar.classList.contains('show')) return;
    if(e.target.closest('#dictBar')) return;
    if(e.target.closest('#articleBody')) {
      // 正文点击也会触发展示，避免先隐藏；交给正文 handler 处理
      return;
    }
    hideDict();
  }, true);

  /* ---------- 生词本 ---------- */
  function updateBadge(){
    const b = $('#wordsBadge');
    const n = store.wordbook.length;
    b.textContent = n; b.style.display = n ? 'grid' : 'none';
  }
  function renderWords(){
    const list = store.wordbook;
    const learned = list.filter(w => w.learned).length;
    $('#wordsStats').innerHTML = `
      <div class="stat-chip"><div class="n">${list.length}</div><div class="l">已收藏词汇</div></div>
      <div class="stat-chip"><div class="n">${learned}</div><div class="l">已掌握</div></div>
      <div class="stat-chip"><div class="n">${Object.keys(store.readDays).length}</div><div class="l">累计打卡天数</div></div>
      <div class="stat-chip"><div class="n">${Object.keys(store.readArticles).length}</div><div class="l">已读文章</div></div>`;
    const wrap = $('#wordsList');
    if(!list.length){
      wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M8 8h6M8 12h5"/></svg>
        <p>生词本还是空的</p>
        <p class="sub">阅读文章时点击英文单词，即可查词并收藏</p></div>`;
      return;
    }
    wrap.innerHTML = list.map((w,i) => `
      <div class="word-card">
        <div class="wc-main">
          <span class="wc-word">${esc(w.w)}</span>
          ${w.pos ? `<span class="wc-pos">${esc(w.pos)}</span>` : ''}
          <p class="wc-def">${esc(w.def) || '（未填写释义）'}</p>
          <div class="wc-from">${w.from ? '出自：《' + esc(w.from) + '》 · ' : ''}${w.date || ''}</div>
          <button class="wc-learned ${w.learned?'on':''}" data-i="${i}" style="${w.learned?'':''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            ${w.learned ? '已掌握' : '标记掌握'}
          </button>
        </div>
        <button class="wc-del" data-i="${i}" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>`).join('');
  }
  $('#wordsList').addEventListener('click', e => {
    const learn = e.target.closest('.wc-learned');
    const del = e.target.closest('.wc-del');
    if(learn){
      const i = +learn.dataset.i;
      store.wordbook[i].learned = !store.wordbook[i].learned;
      saveStore(); renderWords();
      toast(store.wordbook[i].learned ? '标记为已掌握' : '已取消掌握');
    }
    if(del){
      const i = +del.dataset.i;
      store.wordbook.splice(i,1);
      saveStore(); updateBadge(); renderWords();
      toast('已从生词本移除');
    }
  });
  $('#wordsBtn').addEventListener('click', () => go('#/words'));

  /* ---------- 路由 ---------- */
  function parseHash(){
    const h = location.hash || '#/home';
    const m = h.match(/^#\/article\/(.+)$/);
    if(m) return { name:'article', id:m[1] };
    if(h.indexOf('#/words') === 0) return { name:'words' };
    return { name:'home' };
  }
  function go(h){ location.hash = h; }
  function router(){
    const r = parseHash();
    $$('.view').forEach(v => v.classList.remove('active'));
    if(r.name === 'article'){
      $('#view-article').classList.add('active');
      renderArticle(r.id);
      window.scrollTo(0,0);
    } else if(r.name === 'words'){
      $('#view-words').classList.add('active');
      renderWords();
      window.scrollTo(0,0);
    } else {
      $('#view-home').classList.add('active');
      if(!state.todayIds) state.todayIds = todayIds(effectiveToday());
      if(!$('#catPills').innerHTML){ renderPills(); }
      renderGrid();
      window.scrollTo(0,0);
    }
    updateProgress();
  }
  window.addEventListener('hashchange', router);

  /* ---------- 进度条 ---------- */
  function updateProgress(){
    const bar = $('#progressBar'); if(!bar) return;
    const doc = document.documentElement;
    const total = doc.scrollHeight - window.innerHeight;
    const p = total > 0 ? (window.scrollY / total) * 100 : 0;
    bar.style.width = Math.min(100, p) + '%';
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(msg){
    const wrap = $('#toastWrap'), t = $('#toastMsg');
    t.textContent = msg;
    wrap.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => wrap.classList.remove('show'), 2000);
  }

  /* ---------- 日期 ---------- */
  function dateKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* ---------- 初始化 ---------- */
  function init(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.documentElement.classList.add('reduced');
    }
    initTheme();
    const now = new Date();
    $('#todayDay').textContent = String(now.getDate()).padStart(2,'0');
    $('#todayYmd').textContent = cnDate(now);
    state.todayIds = todayIds(effectiveToday());
    renderNav(); renderPills(); updateBadge(); updateHint();
    $('#brandHome').addEventListener('click', () => go('#/home'));
    // 移动端搜索框展开
    const sb = $('#searchBox');
    searchInput.addEventListener('focus', () => sb.classList.add('active'));
    searchInput.addEventListener('blur', () => {
      if(!searchInput.value) sb.classList.remove('active');
    });
    router();
    window.addEventListener('scroll', updateProgress, {passive:true});
  }
  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState !== 'loading') init();
})();
</script>
</body>
</html>
