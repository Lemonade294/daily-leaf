name: Daily Self-Update

# 每天北京时间 05:00 自动把当天日期烧录进网站并推送，
# 触发 GitHub Pages 重建，实现「每日轮换 + 自动部署」的自我更新。
# 前端以该日期为种子确定性选出当日 20 篇，次日自动轮换，无需服务器。
on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Stamp today's date into the site
        run: python update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html last-update.txt
          if git diff --cached --quiet; then
            echo "No change today"
          else
            git commit -m "chore: daily update $(date -u -d '+8 hours' '+%Y-%m-%d')"
            git push
          fi
